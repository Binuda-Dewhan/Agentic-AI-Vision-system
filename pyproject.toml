[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sleep-monitor"
version = "0.1.0"
description = "Agentic AI + Vision system for elderly sleep monitoring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python>=4.8",
    "numpy>=1.24",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "ultralytics>=8.0",
    "langchain>=0.2",
    "langchain-google-genai>=1.0",
    "langgraph>=0.1",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "shapely>=2.0",
    "langchain-core>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1"
]

[project.scripts]
sleep-monitor = "sleep_monitor.cli:cli"

[tool.setuptools.packages.find]
include = ["sleep_monitor*"]
